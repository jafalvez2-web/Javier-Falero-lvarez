<text x="260.0" y="700.0" font-size="13" text-anchor="middle" fill="#555" font-weight="normal" font-style="italic">Se estudia una de las formas (son equivalentes)</text>
<text x="520.0" y="430.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">Todos los H: configuración 1s¹</text>
<text x="520.0" y="458.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">Todos los C: 3 grupos de e⁻ → D.G.E. trigonal plana, sp²</text>
<text x="520.0" y="486.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">   y geometría trigonal plana (120°)</text>
<text x="520.0" y="514.0" font-size="15" text-anchor="start" fill="#1d3557" font-weight="bold">   C: [He]2s²2p² → (2sp²)¹(2sp²)¹(2sp²)¹ (2p<tspan baseline-shift="sub" font-size="11">z</tspan>)¹</text>
<text x="520.0" y="542.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">El N: 4 grupos de e⁻ (3 enlaces + 1 par), pero está junto a una insaturación</text>
<text x="520.0" y="570.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">   → hibridación sp², D.G.E. y geometría trigonal plana; el par queda en el 2p<tspan baseline-shift="sub" font-size="11">z</tspan></text>
<text x="520.0" y="598.0" font-size="15" text-anchor="start" fill="#1d3557" font-weight="bold">   N: [He]2s²2p³ → (2sp²)¹(2sp²)¹(2sp²)¹ (2p<tspan baseline-shift="sub" font-size="11">z</tspan>)²</text>
<text x="520.0" y="661.0" font-size="16" text-anchor="start" fill="#000" font-weight="bold">Descripción de los enlaces (TEV):</text>
<text x="530.0" y="691.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">1) σ: C(2sp²)-H(1s)</text>
<text x="530.0" y="717.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">2) σ: C(2sp²)-C(2sp²)</text>
<text x="530.0" y="743.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">3) σ: C(2sp²)-C(2sp²) y π: C(2p<tspan baseline-shift="sub" font-size="11">z</tspan>)-C(2p<tspan baseline-shift="sub" font-size="11">z</tspan>)</text>
<text x="530.0" y="769.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">4) σ: C(2sp²)-N(2sp²)  (el par solitario del N queda en su 2p<tspan baseline-shift="sub" font-size="11">z</tspan>)</text>
<text x="530.0" y="795.0" font-size="15" text-anchor="start" fill="#000" font-weight="normal">5) σ: N(2sp²)-H(1s)</text>
<text x="550.0" y="1040.0" font-size="10" text-anchor="middle" fill="#000" font-weight="normal"></text>
<text x="550.0" y="900.0" font-size="16" text-anchor="middle" fill="#000" font-weight="bold">La molécula es plana (todos los átomos del anillo son sp²).</text>
<text x="550.0" y="930.0" font-size="16" text-anchor="middle" fill="#000" font-weight="normal">Sistema π: 9 orbitales atómicos p<tspan baseline-shift="sub" font-size="11">z</tspan> (8 C + 1 N), paralelos y contiguos →</text>
<text x="550.0" y="958.0" font-size="16" text-anchor="middle" fill="#c1121f" font-weight="bold">9 orbitales moleculares π con 10 electrones (8 de los C + 2 del N), que llenan 5 de ellos.</text></svg>