.teach h3{color:var(--jade)}

.tip{background:var(--mango-soft);border-radius:12px;padding:12px 14px}

.checkbar.ok{background:var(--jade-soft);border-color:transparent}

.checkbar.ok h3{color:var(--jade)} .checkbar.bad h3{color:var(--coral)}

.skip{background:none;border:none;color:var(--muted);font-weight:600;text-decoration:underline;align-self:center;padding:4px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;display:flex;flex-direction:column;gap:6px}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--jade);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .tr{font-size:.85rem;color:var(--muted)}

  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:4}
.composer form{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;padding:12px}
.composer .round{flex:0 0 48px;height:48px;border-radius:50%;border:none;display:grid;place-items:center;background:var(--jade);color:#fff}
.composer .round.mic2{background:var(--coral)}
.composer .round.on{animation:pulse 1.2s infinite}
.composer .round svg{width:22px;height:22px}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.big-level{font-family:var(--display);font-size:4rem;font-weight:700;color:var(--jade);line-height:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:36px 1fr 44px;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.bars .t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--jade)}
.note{font-size:.85rem;color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--jade);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<div id="app"></div>

<script>
/* ======================= CONTENIDO ======================= */
const LEVELS=["A0","A1","A2","B1","B2","C1"];
const LEVEL_NAMES={A0:"Principiante",A1:"Inicial",A2:"Básico",B1:"Intermedio",B2:"Intermedio alto",C1:"Avanzado"};

/* Ruta de lecciones: las 6 primeras están escritas a mano; el resto las prepara la Profe Bia (Claude) siguiendo el mismo orden. */
const COURSE=[
 {id:1,unit:"Unidad 1 · El presente",title:"Eu falo português",topic:"Pronombres personales en Brasil (você, a gente) y presente de los verbos regulares en -AR (falar, morar, estudar, trabalhar, gostar de)"},
 {id:2,unit:"Unidad 1 · El presente",title:"Eu sou o Javier",topic:"El verbo SER en presente: identidad, origen y profesión"},
 {id:3,unit:"Unidad 1 · El presente",title:"Estou com fome",topic:"El verbo ESTAR, ser frente a estar, 'estar com fome/sede/frio' y 'ficar' para ubicaciones"},
 {id:4,unit:"Unidad 1 · El presente",title:"A gente come e aprende",topic:"Presente de los verbos regulares en -ER e -IR (comer, beber, aprender, entender, abrir, assistir)"},
 {id:5,unit:"Unidad 1 · El presente",title:"Tem que ter",topic:"El verbo TER, 'ter que' (obligación) y 'tem' con el sentido de 'hay'"},
 {id:6,unit:"Unidad 1 · El presente",title:"Vou fazer isso",topic:"El verbo IR y el futuro con ir + infinitivo (sin 'a'), ir à / para"},
 {id:7,unit:"Unidad 2 · Irregulares clave",title:"Fazer, poder, querer",topic:"Presente de los irregulares fazer, poder, querer, saber, dizer"},
 {id:8,unit:"Unidad 2 · Irregulares clave",title:"Estou fazendo",topic:"Estar + gerundio en Brasil (estou fazendo), contraste con Portugal"},
 {id:9,unit:"Unidad 3 · El pasado",title:"Ontem eu falei",topic:"Pretérito perfeito de los verbos en -AR (falei, falou, falamos, falaram)"},
 {id:10,unit:"Unidad 3 · El pasado",title:"Eu fui e fiz",topic:"Pretérito perfeito de -ER/-IR y de los irregulares ser/ir (fui), fazer (fiz), ter (tive), estar (estive)"},
 {id:11,unit:"Unidad 3 · El pasado",title:"Quando eu era criança",topic:"Pretérito imperfeito (falava, comia, era, tinha) y su contraste con el perfeito"},
 {id:12,unit:"Unidad 3 · El pasado",title:"Fiquei feliz",topic:"El verbo FICAR y sus usos: quedarse, ponerse/volverse, estar situado, quedar con alguien"},
 {id:13,unit:"Unidad 4 · Planes y cortesía",title:"Eu falaria",topic:"Futuro do presente (falarei) frente a ir + infinitivo y futuro do pretérito / condicional (falaria) y 'ia falar'"},
 {id:14,unit:"Unidad 5 · El subjuntivo",title:"Espero que você venha",topic:"Presente do subjuntivo (que eu fale, que você venha, que seja, que esteja) tras expresiones de deseo, duda y emoción"},
 {id:15,unit:"Unidad 5 · El subjuntivo",title:"Se eu tivesse",topic:"Imperfeito do subjuntivo (se eu tivesse, se fosse) y oraciones condicionales"},
 {id:16,unit:"Unidad 5 · El subjuntivo",title:"Quando você chegar",topic:"Futuro do subjuntivo (quando você chegar, se puder, quem quiser), que no existe en el español actual"},
 {id:17,unit:"Unidad 6 · Hablar como nativo",title:"Pra gente estudar",topic:"Infinitivo pessoal (para nós estudarmos, é melhor vocês saírem)"},
 {id:18,unit:"Unidad 6 · Hablar como nativo",title:"Vi ele ontem",topic:"Pronombres de objeto en el habla brasileña (te vi, vi ele, me dá), colocación del pronombre y 'lhe' frente a 'você'"},
 {id:19,unit:"Unidad 6 · Hablar como nativo",title:"Tipo, né?",topic:"Marcadores y expresiones del día a día en Brasil: né, tipo, então, beleza, valeu, tá, cadê, a gente se vê"},
 {id:20,unit:"Unidad 6 · Hablar como nativo",title:"Falsos amigos",topic:"Falsos amigos frecuentes entre español y portugués (esquisito, polvo, apelido, exquisito, propina, borracha, oficina, ligar)"}
];
const START_BY_LEVEL={A0:1,A1:1,A2:5,B1:9,B2:13,C1:17};

const L={};
L[1]=[
 {t:"teach",title:"Quién habla: los pronombres",
  body:["En Brasil casi nadie usa **tu**: se dice **você**, y va con el verbo en 3.ª persona, igual que 'usted' en español.","Para 'nosotros', al hablar se usa muchísimo **a gente**, también con el verbo en 3.ª persona. **Nós** existe, pero suena más formal."],
  table:[["yo","eu"],["tú","você"],["él / ella","ele / ela"],["nosotros","a gente / nós"],["vosotros, ustedes","vocês"],["ellos / ellas","eles / elas"]]},
 {t:"teach",title:"Verbos en -AR: falar",
  body:["En la práctica te bastan tres formas: **falo**, **fala**, **falam**."],
  table:[["eu","falo"],["você / ele / a gente","fala"],["nós","falamos"],["vocês / eles","falam"]],
  examples:[{pt:"Eu falo espanhol.",es:"Hablo español."},{pt:"A gente fala português.",es:"Hablamos portugués."},{pt:"Eles falam rápido.",es:"Ellos hablan rápido."}],
  tip:"Pronunciación: la -o final suena 'u' (falo → FA-lu) y -am suena nasal, 'ãu' (falam → FA-lãu)."},
 {t:"mc",q:"¿Cómo se dice 'tú' en Brasil?",opts:["você","tu","vós","ele"],a:0,why:"'Você' es el 'tú' normal en casi todo Brasil, y el verbo va en 3.ª persona: você fala."},
 {t:"mc",q:"¿Qué significa?",say:"Eu falo espanhol.",opts:["Yo hablo español.","Él habla español.","Hablamos español."],a:0,why:"'Falo' es la forma de 'eu'."},
 {t:"fill",q:"Eles ___ no Brasil.",hint:"morar",a:["moram"],why:"Eles → -am: moram. 'Morar' es vivir en un sitio."},
 {t:"fill",q:"A gente ___ todos os dias.",hint:"estudar",a:["estuda"],why:"'A gente' va con 3.ª persona del singular: a gente estuda."},
 {t:"teach",title:"Gostar DE",body:["Cuidado: en portugués no se dice 'me gusta'. Quien gusta es la persona, y siempre se añade **de**.","**de + o = do**, **de + a = da**."],
  examples:[{pt:"Eu gosto de café.",es:"Me gusta el café."},{pt:"Você gosta da música?",es:"¿Te gusta la música?"},{pt:"A gente gosta do Brasil.",es:"Nos gusta Brasil."}]},
 {t:"build",q:"Me gusta el café.",words:["Eu","gosto","de","café","me","o"],a:"Eu gosto de café",why:"Literalmente 'yo gusto de café'."},
 {t:"listen",say:"Você trabalha aqui?",a:["você trabalha aqui"],why:"'Trabalha' = trabajas. La 'lh' suena como la 'll' de 'calle' bien pronunciada."},
 {t:"tr",q:"Nosotros hablamos portugués.",a:["A gente fala português","Nós falamos português"],why:"Las dos valen; 'a gente fala' es lo más natural hablando."},
 {t:"mc",q:"Elige la frase correcta:",opts:["Me gosta a música.","Eu gosto da música.","Eu gosto a música."],a:1,why:"Gostar + de, y de + a = da."},
 {t:"speak",say:"Eu moro em Madri e estudo química.",why:"Fíjate en 'moro' (MÓ-ru) y 'estudo' (es-TU-du)."},
 {t:"tr",q:"¿Tú trabajas?",a:["Você trabalha?","Você trabalha"],why:"Você + 3.ª persona: trabalha."}
];
L[2]=[
 {t:"teach",title:"El verbo SER",body:["SER sirve para lo que eres: identidad, origen, profesión, características.","Ojo: igual que en español, la profesión va sin artículo: **Eu sou estudante**."],
  table:[["eu","sou"],["você / ele / a gente","é"],["nós","somos"],["vocês / eles","são"]],
  examples:[{pt:"Eu sou espanhol.",es:"Soy español."},{pt:"Ela é professora.",es:"Ella es profesora."},{pt:"Vocês são de onde?",es:"¿De dónde sois?"}],
  tip:"'É' lleva acento abierto: suena como 'e' de 'perro'. 'São' es nasal: 'sãu'."},
 {t:"fill",q:"Eu ___ espanhol.",hint:"ser",a:["sou"],why:"Eu sou."},
 {t:"fill",q:"Vocês ___ brasileiros?",hint:"ser",a:["são"],why:"Vocês → são."},
 {t:"mc",q:"¿Qué significa?",say:"Ela é professora.",opts:["Ella es profesora.","Ella está en clase.","Ella tiene una profesora."],a:0,why:"'É' = es."},
 {t:"mc",q:"¿Cómo preguntas '¿De dónde eres?'",opts:["De onde você é?","Onde você está?","De onde você está?"],a:0,why:"El origen va con SER. 'Onde você está?' = ¿dónde estás?"},
 {t:"listen",say:"Eu sou de Madri.",a:["eu sou de madri"],why:"En portugués se escribe 'Madri', sin d final."},
 {t:"fill",q:"A gente ___ estudante.",hint:"ser",a:["é"],why:"'A gente' + 3.ª persona: a gente é."},

function norm(s){return String(s).toLowerCase().replace(/[“”"«»¿?¡!.,;:…()\-]/g," ").replace(/\s+/g," ").trim()}
function noAcc(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"")}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function grade(input,answers){const u=norm(input);if(!u)return{ok:false};
  for(const a of answers){if(u===norm(a))return{ok:true}}
  for(const a of answers){if(noAcc(u)===noAcc(norm(a)))return{ok:true,note:"Cuidado con los acentos: "+a}}
  for(const a of answers){const t=noAcc(norm(a));if(t.length>6&&lev(noAcc(u),t)<=1)return{ok:true,note:"Tienes una errata. Se escribe: "+a}}
  return{ok:false}}
function similarity(a,b){a=noAcc(norm(a));b=noAcc(norm(b));const d=lev(a,b);return 1-d/Math.max(a.length,b.length,1)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let speakRate=1;
async function say(text,rate){rate=rate||speakRate;
  if(cap.tts){try{await cap.tts.speak(text,{language:"pt-BR",rate,voice:"airy"});return}catch(e){if(e&&e.code==="not_granted")cap.tts=null;else if(e&&(e.code==="stopped"||e.code==="replaced"))return}}
  try{const ss=window.speechSynthesis;if(!ss)return;ss.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="pt-BR";u.rate=rate<1?0.7:0.95;
    const v=ss.getVoices().find(v=>/pt[-_]BR/i.test(v.lang))||ss.getVoices().find(v=>/^pt/i.test(v.lang));if(v)u.voice=v;ss.speak(u)}catch(e){}}
let actx=null;
function beep(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  (ok?[660,880]:[300,220]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type=ok?"sine":"triangle";
  g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.18,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.18);
  o.connect(g).connect(actx.destination);o.start(t+i*.11);o.stop(t+i*.11+.2)})}catch(e){}}

let dictUnsub=[];
function dictListen(onText,onStateUI){const d=cap.dict;if(!d)return Promise.reject({code:"unavailable"});
  dictUnsub.forEach(f=>f());let finalT="";
  dictUnsub=[d.onPartial(({text})=>onText((finalT+" "+text).trim(),false)),d.onFinal(({text})=>{finalT+=text;onText(finalT.trim(),true)}),d.onState(({state,reason})=>onStateUI(state,reason))];
  const p=d.start({language:"pt-BR"});return p}

  const inp=h("input",{type:"text",id:"chat-input",placeholder:"Escreva em português…",autocomplete:"off",spellcheck:"false"});
  const micB=cap.dict?h("button",{type:"button",class:"round mic2","aria-label":"Hablar"},icon("mic")):null;
  if(micB)micB.onclick=()=>{if(cap.dict.active()){cap.dict.stop();return}const base=inp.value?inp.value+" ":"";
    dictListen((t)=>{inp.value=base+t},(st)=>{micB.classList.toggle("on",st==="listening");if(st==="idle"&&inp.value.trim())form.requestSubmit()}).catch(()=>{})};
  const form=h("form",{onsubmit:e=>{e.preventDefault();const t=inp.value.trim();if(!t||chatBusy||!cap.sample)return;inp.value="";sendChat(t)}},
    inp,micB,h("button",{class:"round","aria-label":"Enviar"},icon("send")));
  app.append(w,h("div",{class:"composer"},form),tabs());
  setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),30)}
function msgEl(m){if(m.role==="me")return h("div",{class:"msg me"},m.text);
  const el=h("div",{class:"msg bot"},h("div",{},m.pt));
  if(m.fix)el.append(h("div",{class:"fix"},rich("**Corrección:** "+m.fix)));
  const tr=h("div",{class:"tr",hidden:true},m.es||"");
  el.append(tr,h("div",{class:"acts"},h("button",{onclick:()=>say(m.pt)},"Escuchar"),h("button",{onclick:()=>say(m.pt,.7)},"Despacio"),m.es?h("button",{onclick:()=>{tr.hidden=!tr.hidden}},"Traducir"):null));return el}
async function sendChat(text){chatBusy=true;S.chat.push({role:"me",text});const list=$("#chatlist");list.append(msgEl({role:"me",text}));
  const wait=h("div",{class:"msg bot"},h("div",{class:"loading"},h("span",{class:"spin"}),"Bia está escribiendo…"));list.append(wait);window.scrollTo(0,document.body.scrollHeight);
  const hist=S.chat.slice(-12).map(m=>m.role==="me"?"Javier: "+m.text:"Bia: "+m.pt).join("\n");
  const prompt=`Eres "Bia", una profesora carioca simpática que conversa en portugués de Brasil con Javier para que llegue a hablar como un nativo.
${learnerSummary()}
Ajusta tu portugués a su nivel (si es A0-A1, frases muy cortas y sencillas). Habla con naturalidad brasileña (a gente, né, tá), haz UNA pregunta al final para seguir la conversación, y saca a menudo los verbos y temas que está estudiando. Si escribe en español, respóndele en portugués sencillo y anímale a intentarlo en portugués.
Conversación hasta ahora:
${hist}
Devuelve SOLO JSON: {"pt":"tu respuesta en portugués de Brasil, 1-3 frases","es":"traducción al español de tu respuesta","fix":"si el último mensaje de Javier tiene errores, la versión correcta y una explicación muy breve en español; si está perfecto o suena natural, cadena vacía"}`;
  try{const out=await cap.sample.json(prompt,{modelTier:"quick",cache:false});
    const m={role:"bot",pt:String(out.pt||"…"),es:String(out.es||""),fix:String(out.fix||"")};S.chat.push(m);S.chat=S.chat.slice(-40);save();
    wait.replaceWith(msgEl(m));S.xp+=1;say(m.pt)}
  catch(e){wait.replaceWith(h("div",{class:"msg bot"},e&&e.code==="rate_limited"?"Has llegado al límite de uso por ahora. Inténtalo un poco más tarde.":"No me ha llegado tu mensaje. Inténtalo otra vez."));S.chat.pop()}
  chatBusy=false;window.scrollTo(0,document.body.scrollHeight)}

/* ======================= ARRANQUE ======================= */
merge(lsGet());render();
(async()=>{if(!window.claude||!window.claude.use)return;
  const [tts,dict,sample,db,user]=await Promise.all(["tts","dictation","sample","db","user"].map(n=>window.claude.use(n).catch(()=>null)));
  cap.tts=tts;cap.dict=dict;cap.sample=sample;cap.db=db;cap.user=user;
  if(db&&user){try{const id=await user.id();if(id){cap.progressRef=db.collection("data/users/"+id).doc("progress");
    const snap=await cap.progressRef.get();if(snap.exists){const remote=snap.data();
      if(!S.createdAt||(remote.xp||0)>=(S.xp||0))merge(remote);else save()}else{S.createdAt=S.createdAt||Date.now();save()}}}catch(e){cap.progressRef=null}}
  if(!RUN)render()})();
</script>
