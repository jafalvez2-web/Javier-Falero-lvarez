<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, sans-serif" font-size="15">
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- ===== Panel 1: la Tierra / el ángulo theta ===== -->
  <text x="225" y="30" text-anchor="middle" font-size="18" font-weight="bold">1) θ es como la latitud medida desde el Polo Norte</text>

  <!-- eje z -->
  <line x1="225" y1="55" x2="225" y2="420" stroke="#333" stroke-width="2"/>
  <polygon points="225,50 219,64 231,64" fill="#333"/>
  <text x="235" y="62" font-weight="bold">z</text>

  <!-- esfera -->
  <circle cx="225" cy="240" r="150" fill="#eaf3ff" stroke="#3b6fb6" stroke-width="2"/>
  <!-- ecuador -->
  <ellipse cx="225" cy="240" rx="150" ry="35" fill="rgba(220,40,40,0.15)" stroke="#d62828" stroke-width="3"/>

  <!-- polos -->
  <circle cx="225" cy="90" r="6" fill="#1d3557"/>
  <text x="240" y="95">Polo Norte: θ = 0°</text>
  <circle cx="225" cy="390" r="6" fill="#1d3557"/>
  <text x="240" y="408">Polo Sur: θ = 180°</text>
  <text x="380" y="245" fill="#d62828" font-weight="bold">Ecuador:</text>
  <text x="380" y="263" fill="#d62828" font-weight="bold">θ = 90°</text>

  <!-- punto y ángulo theta -->
  <line x1="225" y1="240" x2="331" y2="134" stroke="#2a9d8f" stroke-width="2.5"/>
  <circle cx="331" cy="134" r="5" fill="#2a9d8f"/>
  <path d="M225,190 A50,50 0 0,1 260,205" fill="none" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="238" y="182" fill="#2a9d8f" font-weight="bold">θ</text>
  <text x="300" y="125" fill="#2a9d8f">un punto</text>

  <text x="225" y="448" text-anchor="middle" fill="#d62828">Todos los puntos con θ = 90° → el ECUADOR = plano xy</text>

  <!-- ===== Panel 2: orbital p_z ===== -->
  <text x="675" y="30" text-anchor="middle" font-size="18" font-weight="bold">2) Orbital 3p_z visto de lado</text>

  <!-- eje z -->
  <line x1="675" y1="55" x2="675" y2="420" stroke="#333" stroke-width="2"/>
  <polygon points="675,50 669,64 681,64" fill="#333"/>
  <text x="685" y="62" font-weight="bold">z</text>

  <!-- esfera nodal radial -->
  <circle cx="675" cy="240" r="85" fill="none" stroke="#7b2cbf" stroke-width="2.5" stroke-dasharray="8,6"/>

  <!-- lóbulos internos -->
  <ellipse cx="675" cy="200" rx="22" ry="34" fill="#f4a261" stroke="#c76a1d" stroke-width="1.5"/>
  <ellipse cx="675" cy="280" rx="22" ry="34" fill="#8ecae6" stroke="#2c7da0" stroke-width="1.5"/>
  <!-- lóbulos externos -->
  <ellipse cx="675" cy="128" rx="58" ry="52" fill="#8ecae6" stroke="#2c7da0" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="675" cy="352" rx="58" ry="52" fill="#f4a261" stroke="#c76a1d" stroke-width="1.5" opacity="0.9"/>

  <text x="668" y="205" font-weight="bold">+</text>
  <text x="669" y="285" font-weight="bold">−</text>
  <text x="669" y="133" font-weight="bold">−</text>
  <text x="668" y="357" font-weight="bold">+</text>

  <!-- plano nodal xy -->
  <line x1="510" y1="240" x2="840" y2="240" stroke="#d62828" stroke-width="3"/>
  <text x="845" y="236" fill="#d62828" font-weight="bold">plano xy</text>
  <text x="845" y="254" fill="#d62828">θ = 90°</text>
  <text x="845" y="272" fill="#d62828">(nodo angular)</text>

  <text x="760" y="170" fill="#7b2cbf" font-weight="bold">esfera r = 6a₀/Z</text>
  <text x="760" y="188" fill="#7b2cbf">(nodo radial)</text>

  <text x="675" y="448" text-anchor="middle">Colores = fases (+ / −). Cambian al cruzar cada nodo.</text>
</svg>
