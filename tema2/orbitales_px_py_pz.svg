<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" font-family="Arial, sans-serif" font-size="16">
<rect width="1200" height="930" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<text x="600" y="38" text-anchor="middle" font-size="24" font-weight="bold">Los tres orbitales p: cada uno «es» su coordenada</text>
<text x="600" y="64" text-anchor="middle" font-size="16" fill="#555">Naranja = fase (+)   ·   Azul = fase (−)   ·   Plano rojo = nodo angular (ψ = 0, el electrón nunca está ahí)</text>
<rect x="15" y="90" width="370" height="560" rx="14" fill="#fafafa" stroke="#ddd"/>
<text x="35" y="128" text-anchor="start" font-size="30" font-weight="bold">p<tspan baseline-shift="sub" font-size="18">x</tspan></text>
<ellipse cx="154.1" cy="298.2" rx="53.9" ry="40" transform="rotate(148.5 154.1 298.2)" fill="#f4a261" stroke="#c76a1d" stroke-width="1.5" opacity="0.92"/>
<text x="154.1" y="305.2" text-anchor="middle" font-size="24" font-weight="bold">+</text>
<ellipse cx="245.9" cy="241.8" rx="53.9" ry="40" transform="rotate(148.5 245.9 241.8)" fill="#8ecae6" stroke="#2c7da0" stroke-width="1.5" opacity="0.92"/>
<text x="245.9" y="248.8" text-anchor="middle" font-size="24" font-weight="bold">−</text>
<polygon points="310.0,160.0 310.0,380.0 90.0,380.0 90.0,160.0" fill="rgba(214,40,40,0.22)" stroke="#d62828" stroke-width="2"/>
<line x1="274.4" y1="224.4" x2="107.0" y2="327.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="95.8" y="339.8" text-anchor="middle" font-weight="bold" font-size="18">x</text>
<line x1="80.0" y1="270.0" x2="350.0" y2="270.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="368.0" y="276.0" text-anchor="middle" font-weight="bold" font-size="18">y</text>
<line x1="200.0" y1="390.0" x2="200.0" y2="120.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="200.0" y="108.0" text-anchor="middle" font-weight="bold" font-size="18">z</text>
<circle cx="200" cy="270" r="4" fill="#000"/>
<text x="200" y="455" text-anchor="middle" fill="#000" font-size="17">Parte angular: <tspan font-weight="bold">sen θ · cos φ</tspan></text>
<text x="200" y="485" text-anchor="middle" fill="#555" font-size="17">(es lo mismo que <tspan font-weight="bold">x / r</tspan>)</text>
<text x="200" y="515" text-anchor="middle" fill="#000" font-size="17">Se anula donde <tspan font-weight="bold">x = 0</tspan>:</text>
<text x="200" y="545" text-anchor="middle" fill="#d62828" font-size="17">cos φ = 0  →  <tspan font-weight="bold">φ = 90° y 270°</tspan></text>
<text x="200" y="575" text-anchor="middle" fill="#d62828" font-size="17">Nodo angular = <tspan font-weight="bold">plano yz</tspan></text>
<text x="200" y="605" text-anchor="middle" fill="#555" font-size="14">derecha/izquierda: un lóbulo hacia +x y otro hacia −x</text>
<rect x="415" y="90" width="370" height="560" rx="14" fill="#fafafa" stroke="#ddd"/>
<text x="435" y="128" text-anchor="start" font-size="30" font-weight="bold">p<tspan baseline-shift="sub" font-size="18">y</tspan></text>
<ellipse cx="674.1" cy="270.0" rx="74.1" ry="40" transform="rotate(0.0 674.1 270.0)" fill="#f4a261" stroke="#c76a1d" stroke-width="1.5" opacity="0.92"/>
<text x="674.1" y="277.0" text-anchor="middle" font-size="24" font-weight="bold">+</text>
<ellipse cx="525.9" cy="270.0" rx="74.1" ry="40" transform="rotate(0.0 525.9 270.0)" fill="#8ecae6" stroke="#2c7da0" stroke-width="1.5" opacity="0.92"/>
<text x="525.9" y="277.0" text-anchor="middle" font-size="24" font-weight="bold">−</text>
<polygon points="531.8,201.8 531.8,421.8 668.2,338.2 668.2,118.2" fill="rgba(214,40,40,0.22)" stroke="#d62828" stroke-width="2"/>
<line x1="674.4" y1="224.4" x2="507.0" y2="327.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="495.8" y="339.8" text-anchor="middle" font-weight="bold" font-size="18">x</text>
<line x1="480.0" y1="270.0" x2="750.0" y2="270.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="768.0" y="276.0" text-anchor="middle" font-weight="bold" font-size="18">y</text>
<line x1="600.0" y1="390.0" x2="600.0" y2="120.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="600.0" y="108.0" text-anchor="middle" font-weight="bold" font-size="18">z</text>
<circle cx="600" cy="270" r="4" fill="#000"/>
<text x="600" y="455" text-anchor="middle" fill="#000" font-size="17">Parte angular: <tspan font-weight="bold">sen θ · sen φ</tspan></text>
<text x="600" y="485" text-anchor="middle" fill="#555" font-size="17">(es lo mismo que <tspan font-weight="bold">y / r</tspan>)</text>
<text x="600" y="515" text-anchor="middle" fill="#000" font-size="17">Se anula donde <tspan font-weight="bold">y = 0</tspan>:</text>
<text x="600" y="545" text-anchor="middle" fill="#d62828" font-size="17">sen φ = 0  →  <tspan font-weight="bold">φ = 0° y 180°</tspan></text>
<text x="600" y="575" text-anchor="middle" fill="#d62828" font-size="17">Nodo angular = <tspan font-weight="bold">plano xz</tspan></text>
<text x="600" y="605" text-anchor="middle" fill="#555" font-size="14">un lóbulo hacia +y y otro hacia −y</text>
<rect x="815" y="90" width="370" height="560" rx="14" fill="#fafafa" stroke="#ddd"/>
<text x="835" y="128" text-anchor="start" font-size="30" font-weight="bold">p<tspan baseline-shift="sub" font-size="18">z</tspan></text>
<ellipse cx="1000.0" cy="195.9" rx="74.1" ry="40" transform="rotate(-90.0 1000.0 195.9)" fill="#f4a261" stroke="#c76a1d" stroke-width="1.5" opacity="0.92"/>
<text x="1000.0" y="202.9" text-anchor="middle" font-size="24" font-weight="bold">+</text>
<ellipse cx="1000.0" cy="344.1" rx="74.1" ry="40" transform="rotate(-90.0 1000.0 344.1)" fill="#8ecae6" stroke="#2c7da0" stroke-width="1.5" opacity="0.92"/>
<text x="1000.0" y="351.1" text-anchor="middle" font-size="24" font-weight="bold">−</text>
<polygon points="1041.8,311.8 821.8,311.8 958.2,228.2 1178.2,228.2" fill="rgba(214,40,40,0.22)" stroke="#d62828" stroke-width="2"/>
<line x1="1074.4" y1="224.4" x2="907.0" y2="327.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="895.8" y="339.8" text-anchor="middle" font-weight="bold" font-size="18">x</text>
<line x1="880.0" y1="270.0" x2="1150.0" y2="270.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1168.0" y="276.0" text-anchor="middle" font-weight="bold" font-size="18">y</text>
<line x1="1000.0" y1="390.0" x2="1000.0" y2="120.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1000.0" y="108.0" text-anchor="middle" font-weight="bold" font-size="18">z</text>
<circle cx="1000" cy="270" r="4" fill="#000"/>
<text x="1000" y="455" text-anchor="middle" fill="#000" font-size="17">Parte angular: <tspan font-weight="bold">cos θ</tspan></text>
<text x="1000" y="485" text-anchor="middle" fill="#555" font-size="17">(es lo mismo que <tspan font-weight="bold">z / r</tspan>)</text>
<text x="1000" y="515" text-anchor="middle" fill="#000" font-size="17">Se anula donde <tspan font-weight="bold">z = 0</tspan>:</text>
<text x="1000" y="545" text-anchor="middle" fill="#d62828" font-size="17">cos θ = 0  →  <tspan font-weight="bold">θ = 90°</tspan></text>
<text x="1000" y="575" text-anchor="middle" fill="#d62828" font-size="17">Nodo angular = <tspan font-weight="bold">plano xy</tspan></text>
<text x="1000" y="605" text-anchor="middle" fill="#555" font-size="14">un lóbulo arriba (+z) y otro abajo (−z)</text>
<rect x="15" y="668" width="1170" height="245" rx="14" fill="#eef5ff" stroke="#9cc0ec"/>
<text x="40" y="700" font-size="19" font-weight="bold">De dónde sale: traducción de x, y, z a coordenadas esféricas (r, θ, φ)</text>
<text x="60" y="732" font-size="17">z = r · cos θ</text><text x="330" y="732" font-size="17">→  z/r = cos θ</text><text x="620" y="732" font-size="17" fill="#555">→ parte angular del p<tspan baseline-shift="sub" font-size="12">z</tspan></text>
<text x="60" y="760" font-size="17">y = r · sen θ · sen φ</text><text x="330" y="760" font-size="17">→  y/r = sen θ · sen φ</text><text x="620" y="760" font-size="17" fill="#555">→ parte angular del p<tspan baseline-shift="sub" font-size="12">y</tspan></text>
<text x="60" y="788" font-size="17">x = r · sen θ · cos φ</text><text x="330" y="788" font-size="17">→  x/r = sen θ · cos φ</text><text x="620" y="788" font-size="17" fill="#555">→ parte angular del p<tspan baseline-shift="sub" font-size="12">x</tspan></text>
<text x="40" y="828" font-size="16">θ = ángulo bajando desde el Polo Norte (eje +z): 0° arriba, 90° ecuador, 180° abajo.   φ = vuelta alrededor del eje z (como la longitud), empieza en +x.</text>
<text x="40" y="858" font-size="16"><tspan font-weight="bold">Nodo radial</tspan> (en los 3p): sale de la parte radial, (6 − Zr/a₀) = 0 → r = 6a₀/Z: una esfera, IGUAL para los tres.</text>
<text x="40" y="886" font-size="16">Los tres orbitales p son idénticos: solo cambia hacia dónde apuntan (y por eso cambia el plano nodal).</text>
</svg>