<text x="225" y="588" text-anchor="middle" fill="#2a9d8f" font-size="16" font-weight="bold">θ se mide DESDE EL EJE z</text>
<text x="225" y="616" text-anchor="middle" fill="#555" font-size="16" font-weight="normal">(en tu dibujo, z va hacia ABAJO)</text>
<text x="225" y="644" text-anchor="middle" fill="#d62828" font-size="16" font-weight="normal">cos θ = 0 → θ = 90°</text>
<text x="225" y="672" text-anchor="middle" fill="#000" font-size="16" font-weight="normal">Girar 90° desde z te deja en</text>
<text x="225" y="700" text-anchor="middle" fill="#000" font-size="16" font-weight="normal">el plano que forman x e y</text>
<text x="225" y="728" text-anchor="middle" fill="#d62828" font-size="16" font-weight="bold">→ corte = plano xy</text>
<text x="225" y="756" text-anchor="middle" fill="#555" font-size="16" font-weight="normal">Lóbulos arriba y abajo (eje z)</text>
