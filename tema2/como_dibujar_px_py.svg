<text x="600" y="36" text-anchor="middle" font-size="24" font-weight="bold">Cómo dibujar a mano el corte de p<tspan baseline-shift="sub" font-size="16">y</tspan> y p<tspan baseline-shift="sub" font-size="16">x</tspan> en 3 pasos</text>
<text x="600" y="62" text-anchor="middle" fill="#555">La clave: φ NO se mide desde z (eso es θ). φ se mide en el SUELO (plano horizontal), empezando en el eje x.</text>
<text x="220" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3557">1) Dibuja los ejes y el SUELO</text>
<text x="600" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3557">2) Mide φ en el suelo desde x</text>
<text x="980" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3557">3) Levanta la pared por esos puntos</text>
