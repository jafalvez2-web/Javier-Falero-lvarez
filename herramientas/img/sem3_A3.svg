<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 342' width='680' height='342'>
<defs><marker id='ar' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M2 1L8 5L2 9' fill='none' stroke='context-stroke' stroke-width='1.6'/></marker></defs>
<rect width='680' height='342' fill='#fff'/>
<text x='79.75' y='20' text-anchor='middle' font-size='11.5' font-weight='bold' fill='#7209b9' font-family='Open Sans, Arial, sans-serif'>1. Tostación</text>
<rect x='29.0' y='44' width='101.5' height='170' rx='8' fill='#F6FBF6' stroke='#9bc79b'/>
<text x='79.75' y='111.0' text-anchor='middle' font-size='11' font-weight='bold' fill='#0a5d0a' font-family='Open Sans, Arial, sans-serif'>4 FeS₂ + 11 O₂ →</text>
<text x='79.75' y='129.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>2 Fe₂O₃ + 8 SO₂</text>
<text x='79.75' y='147.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>(90 %)</text>
<line x1='145.5' y1='129.0' x2='177.5' y2='129.0' stroke='#7209b9' stroke-width='1.6' marker-end='url(#ar)'/>
<text x='253.25' y='20' text-anchor='middle' font-size='11.5' font-weight='bold' fill='#7209b9' font-family='Open Sans, Arial, sans-serif'>2. Oxidación</text>
<rect x='202.5' y='44' width='101.5' height='170' rx='8' fill='#F6FBF6' stroke='#9bc79b'/>
<text x='253.25' y='111.0' text-anchor='middle' font-size='11' font-weight='bold' fill='#0a5d0a' font-family='Open Sans, Arial, sans-serif'>2 SO₂ + O₂ →</text>
<text x='253.25' y='129.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>2 SO₃</text>
<text x='253.25' y='147.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>(90 %)</text>
<line x1='319.0' y1='129.0' x2='351.0' y2='129.0' stroke='#7209b9' stroke-width='1.6' marker-end='url(#ar)'/>
<text x='426.75' y='20' text-anchor='middle' font-size='11.5' font-weight='bold' fill='#7209b9' font-family='Open Sans, Arial, sans-serif'>3. Absorción</text>
<rect x='376.0' y='44' width='101.5' height='170' rx='8' fill='#F6FBF6' stroke='#9bc79b'/>
<text x='426.75' y='111.0' text-anchor='middle' font-size='11' font-weight='bold' fill='#0a5d0a' font-family='Open Sans, Arial, sans-serif'>SO₃ + H₂SO₄ →</text>
<text x='426.75' y='129.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>H₂S₂O₇</text>
<text x='426.75' y='147.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>(90 %)</text>
<line x1='492.5' y1='129.0' x2='524.5' y2='129.0' stroke='#7209b9' stroke-width='1.6' marker-end='url(#ar)'/>
<text x='600.25' y='20' text-anchor='middle' font-size='11.5' font-weight='bold' fill='#7209b9' font-family='Open Sans, Arial, sans-serif'>4. Dilución</text>
<rect x='549.5' y='44' width='101.5' height='170' rx='8' fill='#F6FBF6' stroke='#9bc79b'/>
<text x='600.25' y='111.0' text-anchor='middle' font-size='11' font-weight='bold' fill='#0a5d0a' font-family='Open Sans, Arial, sans-serif'>H₂S₂O₇ + H₂O →</text>
<text x='600.25' y='129.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>2 H₂SO₄</text>
<text x='600.25' y='147.0' text-anchor='middle' font-size='11' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>(90 %)</text>
<rect x='20' y='276' width='640' height='46' rx='8' fill='#EEEDFE' stroke='#7F77DD'/>
<text x='340.0' y='295' text-anchor='middle' font-size='11.5' font-weight='bold' fill='#3C3489' font-family='Open Sans, Arial, sans-serif'>Sigue al S: 1 FeS₂ tiene 2 S y cada S acaba en 1 H₂SO₄ neto</text>
<text x='340.0' y='312' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#3C3489' font-family='Open Sans, Arial, sans-serif'>mol S × 0,9 × 0,9 × 0,9 × 0,9 = mol H₂SO₄</text>
<text x='668' y='336' text-anchor='end' font-size='8.5' font-weight='normal' fill='#888' font-family='Open Sans, Arial, sans-serif'>ámbar = reacciona · verde = espectador · morado = producto · rojo = sobra (exceso)</text>
</svg>