-size='11' font-weight='bold' fill='#0a5d0a' font-family='Open Sans, Arial, sans-serif'>Quiero 100 g</text><text x='605.0' y='141.5' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>de KClO₄</text><rect x='30' y='234' width='640' height='50' rx='7' fill='#f6effb' stroke='#7209b9' stroke-width='1.4'/><text x='350.0' y='255.5' text-anchor='middle' font-size='11' font-weight='bold' fill='#7209b9' font-family='Open Sans, Arial, sans-serif'>Voy HACIA ATRÁS: g KClO₄ → mol KClO₄ → mol KClO₃ → mol KClO → mol Cl₂</text><text x='350.0' y='270.5' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#333' font-family='Open Sans, Arial, sans-serif'>y divido por 0,88 (hace falta más Cl₂ del teórico)</text><circle cx='370' cy='300' r='5' fill='#FAEEDA' stroke='#BA7517'/><text x='379' y='303.5' text-anchor='start' font-size='9' font-weight='normal' fill='#555' font-family='Open Sans, Arial, sans-serif'>reacciona</text><circle cx='448' cy='300' r='5' fill='#E1F5EE' stroke='#1D9E75'/><text x='457' y='303.5' text-anchor='start' font-size='9' font-weight='normal' fill='#555' font-family='Open Sans, Arial, sans-serif'>espectador</text><circle cx='526' cy='300' r='5' fill='#EEEDFE' stroke='#7F77DD'/><text x='535' y='303.5' text-anchor='start' font-size='9' font-weight='normal' fill='#555' font-family='Open Sans, Arial, sans-serif'>producto</text><circle cx='604' cy='300' r='5' fill='#FCEBEB' stroke='#E24B4A'/><text x='613' y='303.5' text-anchor='start' font-size='9' font-weight='normal' fill='#555' font-family='Open Sans, Arial, sans-serif'>sobra</text></svg>