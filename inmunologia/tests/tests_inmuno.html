const KEY = "tests-inmuno-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let tema = Object.keys(DATA)[0];
const view = document.getElementById("view");
const tabs = document.getElementById("tabs");
const L = ["A","B","C","D","E"];

function renderTabs(){
  tabs.innerHTML = "";
  Object.keys(DATA).forEach(k => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.textContent = k.replace("T","Tema ");
    b.setAttribute("aria-pressed", k === tema ? "true" : "false");
    b.onclick = () => { tema = k; renderTabs(); renderList(); };
    tabs.appendChild(b);
  });
}

function renderList(){
  const d = DATA[tema];
  view.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = d.titulo; view.appendChild(h);
  const list = document.createElement("div"); list.className = "points"; list.style.marginTop = "14px";
  d.puntos.forEach((p, i) => {
    const b = document.createElement("button"); b.className = "point"; b.type = "button";
    const best = store[tema + "|" + p.n];
    b.innerHTML = `<span class="pnum">${p.n}</span><span class="ptitle">${p.t}</span><span class="pmeta">${p.qs.length} preguntas${best!=null?`<span class="best">${best}/${p.qs.length}</span>`:""}</span>`;
    b.onclick = () => startQuiz(i);
    list.appendChild(b);
  });
  view.appendChild(list);
}

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let quiz = null;
function startQuiz(pi){
  const p = DATA[tema].puntos[pi];
  quiz = { pi, p, i:0, aciertos:0, answers: p.qs.map(()=>null), orders: p.qs.map(q => shuffle(q.o.map((_,k)=>k))), hints: p.qs.map(()=>false) };
  renderQ();
}

function renderQ(){
  const { p, i } = quiz; const q = p.qs[i]; const order = quiz.orders[i]; const ans = quiz.answers[i];
  view.innerHTML = "";
  const top = document.createElement("div"); top.className = "bar";
  top.innerHTML = `<button class="btn" type="button" id="back">← Puntos</button><span class="qcount">Punto ${p.n} · ${p.t}</span>`;
  view.appendChild(top);
  top.querySelector("#back").onclick = renderList;
  const prog = document.createElement("div"); prog.className = "progress"; prog.style.margin = "12px 0";
  prog.innerHTML = `<span style="width:${(i/p.qs.length)*100}%"></span>`; view.appendChild(prog);

  const card = document.createElement("section"); card.className = "card";
  card.innerHTML = `<span class="qcount">Pregunta ${i+1} de ${p.qs.length}</span><p class="qtext">${q.q}</p>`;
  const opts = document.createElement("div"); opts.className = "opts";
  order.forEach((k, pos) => {
    const [txt, ok, why] = q.o[k];
    const b = document.createElement("button"); b.className = "opt"; b.type = "button";
    let inner = `<span class="letter">${L[pos]}</span><span class="otext">${txt}`;
    if (ans !== null) {
      b.disabled = true;
      if (ok) b.classList.add("ok"); else if (k === ans) b.classList.add("bad");
      const verdict = ok ? "Correcta" : (k === ans ? "Tu respuesta: incorrecta" : "Incorrecta");
      inner += `<span class="verdict">${verdict}</span><span class="why">${why}</span>`;
    }
    b.innerHTML = inner + "</span>";
    b.onclick = () => { if (quiz.answers[i] !== null) return; quiz.answers[i] = k; if (ok) quiz.aciertos++; renderQ(); };
    opts.appendChild(b);
  });
  card.appendChild(opts);

  if (quiz.hints[i] && ans === null) {
    const hb = document.createElement("div"); hb.className = "hint"; hb.innerHTML = `<b>Pista:</b> ${q.h}`; card.appendChild(hb);
  }
  const nav = document.createElement("div"); nav.className = "bar";
  const left = document.createElement("div"); left.style.display = "flex"; left.style.gap = "8px";
  const prev = document.createElement("button"); prev.className = "btn"; prev.type = "button"; prev.textContent = "Anterior"; prev.disabled = i === 0;
  prev.onclick = () => { quiz.i--; renderQ(); };
  left.appendChild(prev);
  if (ans === null && !quiz.hints[i]) {
    const hint = document.createElement("button"); hint.className = "btn"; hint.type = "button"; hint.textContent = "Pista";
    hint.onclick = () => { quiz.hints[i] = true; renderQ(); };
    left.appendChild(hint);
  }
  nav.appendChild(left);
  const next = document.createElement("button"); next.className = "btn primary"; next.type = "button";
  const last = i === p.qs.length - 1;
  next.textContent = last ? "Ver resultado" : "Siguiente";
  next.disabled = ans === null;
  next.onclick = () => { if (last) renderResult(); else { quiz.i++; renderQ(); } };
  nav.appendChild(next);
  card.appendChild(nav);
  view.appendChild(card);
}

function renderResult(){
  const { p, aciertos } = quiz; const n = p.qs.length;
  const k = tema + "|" + p.n; if (store[k] == null || aciertos > store[k]) { store[k] = aciertos; save(); }
  const msg = aciertos === n ? "Punto dominado." : aciertos >= Math.ceil(n*0.7) ? "Bien. Repasa las que has fallado." : "Vuelve a leer este punto de los apuntes y repite el test.";
  view.innerHTML = `<section class="card result"><span class="qcount">Punto ${p.n} · ${p.t}</span><span class="score">${aciertos}/${n}</span><p>${msg}</p>
  <div class="bar" style="justify-content:center"><button class="btn" type="button" id="rev">Revisar respuestas</button><button class="btn" type="button" id="rep">Repetir test</button><button class="btn primary" type="button" id="lst">Elegir otro punto</button></div></section>`;
  document.getElementById("rev").onclick = () => { quiz.i = 0; renderQ(); };
  document.getElementById("rep").onclick = () => startQuiz(quiz.pi);
  document.getElementById("lst").onclick = renderList;
}

renderTabs(); renderList();
</script>
